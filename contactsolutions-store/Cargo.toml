[package]
name = "contactsolutions-store"
version = "1.3.0"
edition = "2024"
description = "ContactSolutions's shared store for contacts, groups and themes"
license = "MIT"
publish = false

[lib]
name = "contactsolutions_store"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
