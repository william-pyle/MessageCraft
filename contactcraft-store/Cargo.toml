[package]
name = "contactcraft-store"
version = "1.1.0"
edition = "2024"
description = "ContactCraft's shared contact store: open, read and change ContactCraft's contacts from any Craft app, whether ContactCraft is running or not."
license = "MIT"
publish = false

[lib]
name = "contactcraft_store"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
