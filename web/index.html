<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MessageCraft for Windows</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<meta name="description" content="MessageCraft: read and send your phone's texts from your Windows computer, in the style of MailCraft.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700%7CGoogle+Sans:400,500,700&display=swap">
<style>
  :root {
    --text: #1f1f1f;
    --title: #202124;
    --dim: #5f6368;
    --accent: #1a73e8;
    --bg: #ffffff;
    --rule: #dadce0;
    --head: "Google Sans", Roboto, arial, sans-serif, "Noto Color Emoji", "apple color emoji", "windows emoji", "windows symbol";
    --body: Roboto, "Helvetica Neue", sans-serif, "Noto Color Emoji", "apple color emoji", "windows emoji", "windows symbol";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body { font-family: var(--body); font-size: 14px; -webkit-font-smoothing: antialiased; }
  main { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
  header {
    height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-bottom: 1px solid var(--rule);
  }
  .logo { margin: 0; display: flex; align-items: center; gap: 6px; font: 400 18px/49px var(--head); color: var(--text); }
  .logo .name { font-size: 20.5px; }
  .logo a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .mark { width: 32px; height: 32px; border-radius: 8px; background: #0f68f0; display: grid; place-items: center; flex: none; }
  .mark svg { width: 20px; height: 20px; }
  button.pill { appearance: none; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; border-radius: 100px; text-decoration: none;
    font: 500 14px/20px var(--head); letter-spacing: .1px;
  }
  .pill:hover { background: #1765cc; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
  .pill:focus-visible { outline: 2px solid #174ea6; outline-offset: 2px; }
  .top-button { height: 36px; padding: 0 16px; }
  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 0 116px; }
  .column { width: 620px; max-width: 664px; text-align: center; }
  .title .more { display: none; }
  .title { margin: 0; font: 400 45px/56px var(--head); color: var(--title); letter-spacing: 0; }
  .subtitle { margin: 8px 0 0; font: 400 22px/27px var(--head); color: var(--dim); }
  .cta { margin-top: 54px; width: 291px; height: 48px; }
  .note { margin: 18px 0 0; color: var(--dim); font: 400 14px/20px var(--body); }
  footer { position: absolute; left: 84px; bottom: 24px; display: flex; gap: 44px; }
  footer a { color: var(--dim); text-decoration: none; font: 400 14px/20px var(--body); }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 943px) {
    .column { width: 600px; max-width: 624px; }
    .title .more { display: inline; }
  }
  @media (max-width: 680px) {
    .column { width: calc(100vw - 48px); }
    .title { font-size: 45px; line-height: 56px; }
    .subtitle { line-height: 28px; }
    footer { left: 24px; }
  }
  @media (max-width: 640px) {
    .mark { display: none; }
  }
  @media (max-width: 450px) {
    .cta { width: 180px; }
    .welcome { padding-bottom: 96px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="logo">
      <a href="./" aria-label="MessageCraft home">
        <span class="mark" role="img" aria-label="MessageCraft logo">
          <svg viewBox="0 0 20 20"><path d="M5 3.5h10a2.5 2.5 0 0 1 2.5 2.5v5.5A2.5 2.5 0 0 1 15 14H7.5L4 17v-3.2A2.5 2.5 0 0 1 2.5 11.5V6A2.5 2.5 0 0 1 5 3.5z" fill="#fff"/><circle cx="7" cy="8.75" r="1" fill="#0f68f0"/><circle cx="10" cy="8.75" r="1" fill="#0f68f0"/><circle cx="13" cy="8.75" r="1" fill="#0f68f0"/></svg>
        </span>
        <span class="name">MessageCraft</span>
      </a>
    </h1>
    <button class="pill top-button" type="button" data-download>Download</button>
  </header>
  <section class="welcome" aria-labelledby="welcome-title">
    <div class="column">
      <h1 class="title" id="welcome-title">Welcome to MessageCraft<span class="more"> on Windows</span></h1>
      <h2 class="subtitle">Simple, helpful texting from your computer</h2>
      <button class="pill cta" type="button" data-download>Download for Windows</button>
    </div>
  </section>
  <footer>
    <a href="help.html#privacy">Privacy</a>
    <a href="NOTICE.md">Terms</a>
    <a href="help.html#feedback" role="button">Send feedback</a>
  </footer>
</main>
<script>
  for (const b of document.querySelectorAll("[data-download]")) {
    b.addEventListener("click", () => { location.href = "MessageCraft-windows.zip"; });
  }
</script>
</body>
</html>
