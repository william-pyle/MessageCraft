[package]
name = "messagecraft"
version = "1.0.0"
edition = "2024"
description = "MessageCraft: your phone's text messages on Windows, in the MailCraft style"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[[bin]]
name = "MessageCraft"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
